name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13.0.2
        env:
          MARIADB_DATABASE: accounts_hub_test
          MARIADB_USER: accounts_hub_test
          MARIADB_PASSWORD: accounts_hub_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CLIENT: mysql2
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: accounts_hub_test
      TEST_DB_NAME: accounts_hub_test
      DB_USER: accounts_hub_test
      DB_PASSWORD: accounts_hub_test_password
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:prepare
      - run: npm run test:database
      - run: npm run verify
