name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: account_app_test
          MARIADB_USER: account_app_test
          MARIADB_PASSWORD: account_app_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CLIENT: mysql2
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: account_app_test
      TEST_DB_NAME: account_app_test
      DB_USER: account_app_test
      DB_PASSWORD: account_app_test_password
      AUTH_LOCAL_SESSION_SECRET: ci-only-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:prepare
      - run: npm run test:database
      - run: npm run verify
