name: Verify

on:
  # GitHub bills Actions minutes in private repositories, so this verification runs at most once a day, and only
  # when the branch has moved since the previous run (the changes job), not on every push or pull request. Run it by
  # hand with workflow_dispatch.
  schedule:
    - cron: "29 19 * * *" # 19:29 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A scheduled run bills even when nothing changed, so it first compares the branch with the commit the previous run
  # of this workflow checked, and verification is skipped when they are the same. A manual run always verifies.
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        name: Compare the branch with the previous run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          workflow="${GITHUB_WORKFLOW_REF%%@*}"
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow##*/}/runs?branch=$GITHUB_REF_NAME&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")][0].head_sha // \"\"")" || previous=""
          if [ "$previous" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME is still at $GITHUB_SHA, which the previous run checked: skipping verification."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_REF_NAME is at $GITHUB_SHA, the previous run checked ${previous:-nothing found}: verifying."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:13.0.2
        env:
          MARIADB_DATABASE: database_app
          MARIADB_USER: database_app
          MARIADB_PASSWORD: database_app_ci_password
          MARIADB_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CLIENT: mysql2
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: database_app
      TEST_DB_NAME: database_app_test
      BROWSER_TEST_DB_NAME: database_app_browser
      DB_USER: database_app
      DB_PASSWORD: database_app_ci_password
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create the isolated test database
        run: >-
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -proot_ci_password -e
          "CREATE DATABASE database_app_test; GRANT ALL ON database_app_test.* TO 'database_app'@'%';"
      - run: npm ci
      - run: npm run db:prepare
      - run: npm run verify
